<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order Tracker & Live Revenue</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
        }
    </script>
</head>
<body id="app-body" class="bg-amber-50 text-gray-800 dark:bg-zinc-950 dark:text-zinc-100 min-h-screen p-4 flex flex-col items-center font-sans antialiased transition-colors duration-300">

    <!-- Theme Toggle Floating Bar -->
    <div class="w-full max-w-2xl flex justify-end mb-2">
        <button onclick="toggleTheme()" class="flex items-center gap-2 bg-white dark:bg-zinc-900 border border-amber-200 dark:border-amber-500/20 px-3 py-1.5 rounded-full shadow-sm text-xs font-bold text-amber-900 dark:text-amber-300 hover:scale-105 transition-all cursor-pointer">
            <span id="theme-icon">🌙</span>
            <span id="theme-text">Dark Mode</span>
        </button>
    </div>

    <!-- Revenue Dashboard Header -->
    <div class="w-full max-w-2xl bg-white dark:bg-zinc-900/90 backdrop-blur-md p-5 sm:p-6 rounded-3xl shadow-md dark:shadow-2xl border border-amber-200 dark:border-amber-500/20 mb-6 transition-colors duration-300">
        <div class="flex justify-between items-center border-b border-gray-100 dark:border-zinc-800 pb-4 mb-5">
            <div>
                <h1 class="text-[11px] font-bold text-amber-700 dark:text-amber-400 uppercase tracking-wider">⚡ Executive Dashboard</h1>
                <p id="tracker-title" class="text-lg sm:text-xl font-bold dark:font-serif text-gray-900 dark:text-amber-100">Realtime Revenue & Order Tracker</p>
            </div>
            <span class="inline-flex items-center gap-1.5 bg-green-100 dark:bg-emerald-950/80 border border-transparent dark:border-emerald-500/30 text-green-800 dark:text-emerald-300 text-xs font-bold px-3 py-1 rounded-full">
                <span class="w-2 h-2 rounded-full bg-green-500 dark:bg-emerald-400 animate-pulse"></span> Live Sync
            </span>
        </div>

        <div class="grid grid-cols-3 gap-3 text-center">
            <div class="bg-green-50 dark:bg-zinc-950/60 p-3 sm:p-4 rounded-2xl border border-green-200 dark:border-amber-500/20">
                <span class="text-[10px] sm:text-[11px] font-bold text-green-700 dark:text-amber-400/80 uppercase tracking-wider block mb-1">Total Revenue</span>
                <span id="stat-revenue" class="text-base sm:text-xl font-extrabold text-green-800 dark:text-emerald-400">RM 0.00</span>
            </div>
            <div class="bg-amber-50 dark:bg-zinc-950/60 p-3 sm:p-4 rounded-2xl border border-amber-200 dark:border-amber-500/20">
                <span class="text-[10px] sm:text-[11px] font-bold text-amber-700 dark:text-amber-400/80 uppercase tracking-wider block mb-1">On Hold</span>
                <span id="stat-onhold" class="text-base sm:text-xl font-extrabold text-amber-800 dark:text-amber-300">0</span>
            </div>
            <div class="bg-blue-50 dark:bg-zinc-950/60 p-3 sm:p-4 rounded-2xl border border-blue-200 dark:border-amber-500/20">
                <span class="text-[10px] sm:text-[11px] font-bold text-blue-700 dark:text-amber-400/80 uppercase tracking-wider block mb-1">Completed</span>
                <span id="stat-completed" class="text-base sm:text-xl font-extrabold text-blue-800 dark:text-sky-400">0</span>
            </div>
        </div>
    </div>

    <!-- Main Container -->
    <main class="w-full max-w-2xl bg-white dark:bg-zinc-900/90 backdrop-blur-md p-6 rounded-3xl shadow-md dark:shadow-2xl border border-amber-200 dark:border-amber-500/20 transition-colors duration-300">
        
        <!-- Controls Bar -->
        <div class="space-y-4 mb-6">
            <div class="flex justify-between items-center">
                <label class="block text-xs font-bold uppercase tracking-wider text-amber-900 dark:text-amber-200/90">🔍 Order Tracking Lookup</label>
                <button onclick="toggleViewAll()" id="toggle-view-btn" class="text-xs font-bold bg-amber-100 dark:bg-amber-500/10 hover:bg-amber-200 dark:hover:bg-amber-500/20 text-amber-800 dark:text-amber-300 border border-transparent dark:border-amber-500/30 px-3.5 py-1.5 rounded-xl transition">
                    📋 View All Orders (<span id="total-orders-count">0</span>)
                </button>
            </div>

            <div class="flex gap-2">
                <!-- Fixed ORD- Prefix Field -->
                <div class="flex w-full border border-gray-200 dark:border-zinc-700/80 rounded-2xl overflow-hidden bg-amber-50/50 dark:bg-zinc-950/80 focus-within:ring-2 focus-within:ring-amber-500 dark:focus-within:border-amber-500/70 transition">
                    <span class="bg-amber-200/60 dark:bg-amber-500/10 text-amber-900 dark:text-amber-300 px-4 py-3 font-extrabold text-sm flex items-center select-none border-r border-amber-200 dark:border-zinc-800">
                        ORD-
                    </span>
                    <input type="text" id="order-number-input" placeholder="4077" class="w-full p-3 text-sm bg-transparent text-gray-800 dark:text-amber-100 placeholder-gray-400 dark:placeholder-zinc-600 focus:outline-none font-bold">
                </div>
                <button onclick="trackByOrderId()" class="bg-amber-700 dark:bg-gradient-to-r dark:from-amber-600 dark:to-amber-700 hover:bg-amber-800 dark:hover:from-amber-500 dark:hover:to-amber-600 text-white dark:text-zinc-950 font-bold px-6 py-3 rounded-2xl text-sm transition shadow-sm dark:shadow-lg whitespace-nowrap">
                    Search
                </button>
            </div>
            <p id="search-error" class="text-xs text-red-600 dark:text-rose-400 hidden font-medium pl-1"></p>
        </div>

        <hr class="border-gray-100 dark:border-zinc-800 my-5">

        <!-- Tracking / All Orders Display -->
        <div id="tracking-results" class="space-y-4 hidden"></div>

        <!-- Blank State -->
        <div id="empty-state" class="text-center py-10 text-gray-400 dark:text-zinc-500 text-sm font-light">
            <span class="text-3xl block mb-2">📦</span>
            Enter an order number above (e.g. <b class="text-gray-600 dark:text-amber-200/80">4077</b>) or click <b class="text-gray-600 dark:text-amber-200/80">"View All Orders"</b>.
        </div>
    </main>

    <!-- JS Module Script -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, onSnapshot, doc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDgcBDdJaGkEBS1ihJASDAayNHWgrJ-UN8",
            authDomain: "deepavalicookies2026.firebaseapp.com",
            databaseURL: "https://deepavalicookies2026-default-rtdb.firebaseio.com/",
            projectId: "deepavalicookies2026",
            storageBucket: "deepavalicookies2026.firebasestorage.app",
            messagingSenderId: "648876725443",
            appId: "1:648876725443:web:beabca40332d99f90fbe76",
            measurementId: "G-CH5L1EP9SK"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        let allOrders = [];
        let showingAll = false;

        // Theme Toggle Logic
        window.toggleTheme = function() {
            const html = document.documentElement;
            const icon = document.getElementById('theme-icon');
            const text = document.getElementById('theme-text');

            if (html.classList.contains('dark')) {
                html.classList.remove('dark');
                icon.innerText = "🌙";
                text.innerText = "Dark Mode";
                localStorage.setItem('theme', 'light');
            } else {
                html.classList.add('dark');
                icon.innerText = "☀️";
                text.innerText = "Light Mode";
                localStorage.setItem('theme', 'dark');
            }
        };

        // Initialize Theme from LocalStorage
        if (localStorage.getItem('theme') === 'dark') {
            document.documentElement.classList.add('dark');
            document.getElementById('theme-icon').innerText = "☀️";
            document.getElementById('theme-text').innerText = "Light Mode";
        }

        window.addEventListener('DOMContentLoaded', () => {
            // Realtime Orders Listener
            onSnapshot(collection(db, "orders"), (snapshot) => {
                allOrders = snapshot.docs.map(docSnap => ({ id: docSnap.id, ...docSnap.data() }));
                document.getElementById('total-orders-count').innerText = allOrders.length;
                
                calculateRevenueAndStats();

                const currentInput = document.getElementById('order-number-input').value.trim();
                if (showingAll) {
                    renderOrdersList(allOrders);
                } else if (currentInput) {
                    trackByOrderId();
                }
            });

            // Sync Store Name
            onSnapshot(doc(db, "settings", "store"), (docSnap) => {
                if (docSnap.exists() && docSnap.data().title) {
                    document.getElementById('tracker-title').innerText = `${docSnap.data().title} - Order Tracker`;
                }
            });

            // Enter Key Search
            document.getElementById('order-number-input').addEventListener('keypress', (e) => {
                if (e.key === 'Enter') trackByOrderId();
            });
        });

        function calculateRevenueAndStats() {
            let totalRevenue = 0;
            let onHoldCount = 0;
            let completedCount = 0;

            allOrders.forEach(order => {
                const status = order.status;
                const orderTotal = Number(order.total) || 0;

                if (status === 'Shipped / Completed') {
                    totalRevenue += orderTotal;
                    completedCount++;
                } else if (status === 'Pending Payment' || status === 'Paid & Preparing') {
                    onHoldCount++;
                }
            });

            document.getElementById('stat-revenue').innerText = `RM ${totalRevenue.toFixed(2)}`;
            document.getElementById('stat-onhold').innerText = onHoldCount;
            document.getElementById('stat-completed').innerText = completedCount;
        }

        window.trackByOrderId = function() {
            showingAll = false;
            document.getElementById('toggle-view-btn').innerText = `📋 View All Orders (${allOrders.length})`;
            
            const rawInput = document.getElementById('order-number-input').value.trim();
            const errorEl = document.getElementById('search-error');
            const resultsContainer = document.getElementById('tracking-results');
            const emptyState = document.getElementById('empty-state');

            if (!rawInput) {
                errorEl.innerText = "Please enter an order number (e.g. 4077).";
                errorEl.classList.remove('hidden');
                return;
            }

            errorEl.classList.add('hidden');

            const targetOrderId = `ord-${rawInput.toLowerCase().replace('ord-', '')}`;
            const matchedOrder = allOrders.find(o => (o.orderId || '').toLowerCase() === targetOrderId);

            if (!matchedOrder) {
                emptyState.innerHTML = `<span class="text-3xl block mb-2 opacity-60">❌</span> Order "<b>${targetOrderId.toUpperCase()}</b>" was not found.`;
                emptyState.classList.remove('hidden');
                resultsContainer.classList.add('hidden');
            } else {
                emptyState.classList.add('hidden');
                resultsContainer.classList.remove('hidden');
                renderOrdersList([matchedOrder]);
            }
        }

        window.toggleViewAll = function() {
            const resultsContainer = document.getElementById('tracking-results');
            const emptyState = document.getElementById('empty-state');
            const toggleBtn = document.getElementById('toggle-view-btn');

            if (!showingAll) {
                showingAll = true;
                document.getElementById('order-number-input').value = '';
                document.getElementById('search-error').classList.add('hidden');
                toggleBtn.innerText = "🔍 Search Single Order";

                if (allOrders.length === 0) {
                    emptyState.innerHTML = `<span class="text-3xl block mb-2 opacity-60">📋</span> No orders found in database yet.`;
                    emptyState.classList.remove('hidden');
                    resultsContainer.classList.add('hidden');
                } else {
                    emptyState.classList.add('hidden');
                    resultsContainer.classList.remove('hidden');
                    renderOrdersList(allOrders);
                }
            } else {
                showingAll = false;
                toggleBtn.innerText = `📋 View All Orders (${allOrders.length})`;
                resultsContainer.classList.add('hidden');
                emptyState.innerHTML = `<span class="text-3xl block mb-2">📦</span> Enter an order number above (e.g. <b>4077</b>) or click <b>"View All Orders"</b>.`;
                emptyState.classList.remove('hidden');
            }
        }

        function getStatusStep(status) {
            switch (status) {
                case 'Pending Payment': return 1;
                case 'Paid & Preparing': return 2;
                case 'Shipped / Completed': return 3;
                case 'Cancelled': return -1;
                default: return 1;
            }
        }

        function renderOrdersList(ordersToRender) {
            const container = document.getElementById('tracking-results');
            container.innerHTML = '';

            const sorted = [...ordersToRender].sort((a, b) => (b.timestamp || 0) - (a.timestamp || 0));

            sorted.forEach(order => {
                const step = getStatusStep(order.status);
                const isCancelled = step === -1;

                let itemsHtml = (order.items || []).map(i => `
                    <div class="flex justify-between text-xs py-1.5 border-b border-gray-100 dark:border-zinc-800/60 last:border-0">
                        <span class="text-gray-700 dark:text-zinc-300">${i.name} <span class="text-amber-800 dark:text-amber-400/80 font-semibold">(x${i.qty})</span></span>
                        <span class="font-semibold text-gray-800 dark:text-amber-200/90">RM ${(i.price * i.qty).toFixed(2)}</span>
                    </div>
                `).join('');

                container.innerHTML += `
                    <div class="bg-amber-50/50 dark:bg-zinc-950/70 p-5 rounded-2xl border border-amber-200 dark:border-amber-500/20 shadow-sm dark:shadow-lg space-y-4 mb-4">
                        <div class="flex justify-between items-start border-b border-amber-200 dark:border-zinc-800 pb-3">
                            <div>
                                <span class="bg-amber-800 dark:bg-gradient-to-r dark:from-amber-600 dark:to-amber-700 text-white dark:text-zinc-950 text-[10px] font-bold px-3 py-1 rounded-full uppercase tracking-wider">${order.orderId}</span>
                                <h3 class="font-bold dark:font-serif text-base text-amber-950 dark:text-amber-100 mt-2.5">${order.name} <span class="text-xs font-normal text-gray-500 dark:text-zinc-400">(${order.phone})</span></h3>
                                <p class="text-[11px] text-gray-500 dark:text-zinc-500 mt-0.5">${order.date || ''}</p>
                            </div>
                            <div class="text-right">
                                <span class="text-base sm:text-lg font-extrabold text-amber-900 dark:text-amber-400 block">RM ${Number(order.total).toFixed(2)}</span>
                                <span class="text-[11px] font-semibold ${isCancelled ? 'text-red-700 bg-red-100 dark:text-rose-400 dark:bg-rose-950/60 dark:border dark:border-rose-800/40' : 'text-amber-800 bg-amber-100 dark:text-amber-300 dark:bg-amber-950/60 dark:border dark:border-amber-500/30'} px-2.5 py-1 rounded-lg inline-block mt-1.5">
                                    ${order.status}
                                </span>
                            </div>
                        </div>

                        <!-- Step Tracker -->
                        ${!isCancelled ? `
                            <div class="py-1">
                                <div class="flex justify-between text-[10px] font-bold uppercase tracking-wider mb-2">
                                    <span class="${step >= 1 ? 'text-amber-800 dark:text-amber-400' : 'text-gray-400 dark:text-zinc-600'}">1. Placed (On Hold)</span>
                                    <span class="${step >= 2 ? 'text-amber-800 dark:text-amber-400' : 'text-gray-400 dark:text-zinc-600'}">2. Preparing</span>
                                    <span class="${step >= 3 ? 'text-green-700 dark:text-emerald-400' : 'text-gray-400 dark:text-zinc-600'}">3. Delivered (Revenue Added)</span>
                                </div>
                                <div class="w-full bg-gray-200 dark:bg-zinc-800/80 rounded-full h-1.5 overflow-hidden flex">
                                    <div class="bg-amber-600 dark:bg-gradient-to-r dark:from-amber-500 dark:to-amber-400 h-1.5 transition-all duration-500 rounded-full" style="width: ${step === 1 ? '33%' : step === 2 ? '66%' : '100%'}"></div>
                                </div>
                            </div>
                        ` : `
                            <div class="p-2.5 bg-red-100/70 dark:bg-rose-950/40 border border-red-200 dark:border-rose-800/30 rounded-xl text-xs text-red-700 dark:text-rose-300 font-medium text-center">
                                🔴 Order Cancelled. Excluded from revenue.
                            </div>
                        `}

                        <!-- Items Breakdown -->
                        <div class="bg-white dark:bg-zinc-900/80 p-3.5 rounded-xl border border-amber-100 dark:border-zinc-800">
                            <p class="text-[11px] font-bold text-amber-900 dark:text-amber-400/90 uppercase tracking-wider mb-1.5">Order Items Summary</p>
                            ${itemsHtml}
                        </div>
                    </div>
                `;
            });
        }
    </script>
</body>
</html>
